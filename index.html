<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talent Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{--bg:#f7f8fc;--sf:#fff;--tx:#0f1b33;--mut:#66738b;--ln:#e5e8ef;--ac:#2956e8;--acs:#edf2ff;--ok:#0f9d6b;--wn:#b86e00;--er:#d6334f;--vi:#6d4fd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111d;--sf:#121a29;--tx:#e8edf6;--mut:#93a0b8;--ln:#232e44;--ac:#7b98ff;--acs:#18233d;--wn:#e8a43a;--ok:#34c58e;--er:#ff6b84;--vi:#a28bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b111d;--sf:#121a29;--tx:#e8edf6;--mut:#93a0b8;--ln:#232e44;--ac:#7b98ff;--acs:#18233d;--wn:#e8a43a;--ok:#34c58e;--er:#ff6b84;--vi:#a28bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.app{display:flex;min-height:100%}
.side{width:248px;flex:none;background:var(--sf);border-right:1px solid var(--ln);padding:18px 14px;display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;z-index:30;transform:translateX(-103%);transition:transform .2s;overflow-y:auto}
.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:20;display:none}.scrim.on{display:block}
@media (min-width:960px){.side{position:sticky;top:0;height:100vh;transform:none;align-self:flex-start}#menu,.scrim{display:none!important}}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-weight:800}
.brand b{display:block;line-height:1.2}.brand small,.mut{color:var(--mut)}
.grp{font-size:12px;color:var(--mut);margin:14px 8px 4px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;color:var(--mut);cursor:pointer;text-align:left;font-weight:500}
.ni span{flex:1}.ni em{font-style:normal;font-size:12px}
.ni:hover{background:var(--bg)}.ni.on{background:var(--acs);color:var(--ac);font-weight:700}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--ln);display:grid;gap:8px}
main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px clamp(14px,3vw,32px);border-bottom:1px solid var(--ln);background:var(--sf)}
.crumb{color:var(--mut);display:flex;gap:8px;align-items:center;min-width:0}.crumb b{color:var(--tx);font-weight:600}
.chip{border:1px solid var(--ln);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--mut);white-space:nowrap}
.page{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,32px)}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;line-height:1.05;margin:0 0 8px;font-weight:800}h1 i{color:var(--ac);font-style:normal}
h2{margin:26px 0 2px;font-size:20px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:0 14px;min-height:40px;font-weight:600;cursor:pointer;white-space:nowrap}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
:root[data-theme="dark"] .pri{color:#0b111d}
.tool{display:flex;gap:10px;flex-wrap:wrap;padding:10px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin:16px 0 14px}
.sr{flex:1 1 220px;position:relative}
.sr input{width:100%;min-height:42px;border:1px solid var(--ln);border-radius:10px;padding:0 44px 0 38px;background:var(--bg)}
.sr svg{position:absolute;left:12px;top:13px;color:var(--mut)}
kbd{position:absolute;right:10px;top:9px;border:1px solid var(--ln);border-radius:6px;padding:0 7px;font-size:12px;color:var(--mut);background:var(--sf)}
select{min-height:42px;border:1px solid var(--ln);border-radius:10px;padding:0 10px;background:var(--sf);color:var(--tx);max-width:100%}
.vw{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.vw button{border:0;background:none;width:42px;cursor:pointer;color:var(--mut);display:grid;place-items:center}.vw .on{background:var(--acs);color:var(--ac)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tb{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--mut)}
.tb em{font-style:normal;font-size:12px;margin-left:5px}
.tb.on{background:var(--acs);border-color:color-mix(in srgb,var(--ac) 35%,var(--ln));color:var(--ac);font-weight:600}
.meta{margin:10px 0 14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:18px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;cursor:pointer;min-width:0}
.cd:hover,.cd:focus-visible{border-color:var(--ac);outline:0}
.pv{background:var(--acs);padding:16px;height:148px;display:flex;flex-direction:column;justify-content:space-between}
.av{width:44px;height:44px;border-radius:12px;background:var(--sf);color:var(--ac);font-weight:700;display:grid;place-items:center;border:1px solid var(--ln)}
.stg{font-weight:700;margin-bottom:8px}
.seg{display:flex;gap:3px}.seg i{flex:1;height:5px;border-radius:9px;background:color-mix(in srgb,var(--mut) 25%,transparent)}
.seg .on{background:var(--ac)}.seg .cur{background:var(--wn)}.seg .rj{background:var(--er)}.seg .jn{background:var(--ok)}
.bd{padding:14px 16px 16px}
.tg{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:10px}
.tg span:first-child{border:1px solid var(--ln);border-radius:7px;padding:2px 9px;max-width:68%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg span:last-child{color:var(--mut)}
.bd h3{margin:0 0 2px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd p{margin:2px 0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px}
.pl{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,currentColor 13%,transparent)}
.a{color:var(--wn)}.v{color:var(--vi)}.r{color:var(--er)}.g{color:var(--ok)}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--acs)}
.empty{border:1px dashed var(--ln);border-radius:14px;padding:40px 16px;text-align:center;color:var(--mut)}
.md{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.md{align-items:center;padding:24px}}
.sh{background:var(--sf);width:100%;max-width:820px;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 20px 0}
@media (min-width:700px){.sh{border-radius:18px}}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px}.mh h2{margin:0}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.fg4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fl{display:block;font-size:12px;color:var(--mut)}
.fl input,.fl select{display:block;width:100%;margin-top:4px;min-height:40px;border:1px solid var(--ln);border-radius:9px;padding:0 10px;background:var(--bg);color:var(--tx)}
fieldset{border:1px solid var(--ln);border-radius:12px;margin:12px 0 0;padding:6px 12px 14px;min-width:0}
legend{font-weight:700;padding:0 6px;font-size:13px}
.sec{margin:20px 0 0;font-size:14px}
.mf{position:sticky;bottom:0;background:var(--sf);display:flex;gap:8px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:10px;border-top:1px solid var(--ln)}.mf span{flex:1}
.er{color:var(--er);margin:8px 0 0}
textarea{width:100%;border:1px solid var(--ln);border-radius:10px;background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,monospace}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw}
@media (max-width:639px){input,select,textarea{font-size:16px}.tool select{flex:1 1 140px}.top .chip{display:none}}
.ni svg{flex:none}
#ftog{display:none;width:100%;justify-content:space-between;margin-top:16px}
.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;padding:12px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin:16px 0 18px}
@media (max-width:959px){#ftog{display:flex}.fbar:not(.open){display:none}.fbar{margin-top:8px}}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;min-width:0}.pn h3{margin:0 0 12px;font-size:14px}
.ch{position:relative;height:clamp(220px,34vw,300px)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;min-width:0}.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}.kpi small{display:block}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.g2,.g3{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.mt{margin-top:14px}
@media (min-width:1100px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.kc{flex:0 0 270px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;max-height:72vh}
.kh{display:flex;justify-content:space-between;padding:2px 4px 10px}.kl{overflow-y:auto}
.kk{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:13px}.kk:hover{border-color:var(--ac)}.kr{display:flex;justify-content:space-between;gap:6px}
.wide th:nth-child(2),.wide td:nth-child(2){position:sticky;left:0;background:var(--sf);z-index:1}
.ch.sm{height:200px}.ch.sm.h{height:270px}
.pn.s{padding:12px}.pn.s h3{font-size:13px;margin-bottom:8px}
.g3e{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.g3e{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.g3e{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cp{min-width:0}.cp th,.cp td{padding:6px 10px;font-size:12px}
.ac{color:var(--ac)}
.cs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.nl{max-height:320px;overflow-y:auto}
.nt{display:flex;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--ln);cursor:pointer}
.nt:first-child{border-top:0}.nt:hover,.nt:focus-visible{background:var(--acs);outline:0}
.nd{flex:none;min-width:84px}.nm{flex:1;min-width:0}.nm b,.nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{background:var(--er);color:#fff!important;border-radius:99px;padding:0 7px;font-weight:700}
.hire{display:flex;align-items:center;gap:14px;background:var(--acs);border-radius:99px;padding:8px 20px 8px 8px}
.hirec{flex:none;width:60px;height:60px;border-radius:50%;background:#f59e0b;color:#1b1300;display:grid;place-items:center;font-size:24px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand"><span class="logo">R</span><div><b>Recruitment</b><small>Talent pipeline</small></div></div>
  <div class="grp">Menu</div><nav id="nav"></nav>
    <div class="foot"><button class="bt" id="imp">Impor Excel / CSV</button><button class="bt" id="exp">Ekspor ke Excel</button><input type="file" id="file" accept=".xlsx,.xls,.csv" hidden><small class="mut">Format kolom sama seperti spreadsheet rekrutmen. Hasil ekspor bisa diimpor kembali.</small></div>
</aside>
<div class="scrim" id="scrim"></div>
<main>
  <header class="top">
    <button class="bt" id="menu" aria-label="Buka menu">Menu</button>
    <nav class="crumb"><span>Workspace</span>/<b>Talent pipeline</b></nav>
    <div style="display:flex;gap:8px;align-items:center"><span class="chip">Data tersimpan di browser</span><button class="bt" id="theme"></button></div>
  </header>
  <div class="page">
    <div class="head">
      <div><h1 id="vt"></h1><p class="mut" id="vd" style="margin:0;max-width:60ch"></p></div>
      <button class="bt pri" id="add">+ Tambah kandidat</button>
    </div>
    <button class="bt" id="ftog" aria-label="Tampilkan filter">Filter</button>
    <div class="fbar" id="fbar"><label class="fl">Lamar dari<input type="date" name="from"></label><label class="fl">Sampai<input type="date" name="to"></label><label class="fl">Posisi<select name="pos"></select></label><label class="fl">Perusahaan<select name="per"></select></label><label class="fl">Sumber<select name="src"></select></label><button class="bt" data-reset>Reset filter</button></div>
    <div id="v-oth"></div>
    <div id="v-lib"><h2 id="ct"></h2><p class="mut" id="cd" style="margin:0"></p>
    <div class="tool">
      <div class="sr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Cari nama, posisi, universitas, jurusan…"><kbd>/</kbd></div>
      <select id="sort" aria-label="Urutan"><option value="new">Lamaran terbaru</option><option value="name">Nama A–Z</option><option value="stage">Tahap terjauh</option></select>
      <select id="stg" aria-label="Filter tahap seleksi"></select>
      <div class="vw"><button data-v="grid" aria-label="Tampilan kartu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg></button><button data-v="list" aria-label="Tampilan tabel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="meta" id="cnt"></div>
    <div id="out"></div></div>
  </div>
</main>
</div>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SRC=["E-Career","Jobstreet","Head Hunter","Referral","LinkedIn"],KET=["","NEXT","REJECT","TALENT POOL"];
const ST=[["psi","Psikotes (IAS)"],["hc","Interview HC"],["pc","Plus Consulting"],["ipg","Interview Committee IPG"],["tms","Interview TMS"],["usr","Interview User"],["mcu","MCU"],["off","Offering Letter"],["join","Join"]];
const COLS=["Lamaran Masuk",...ST.map(s=>s[1])];
const F=[["nama","Nama Pelamar"],["per","Perusahaan"],["pos","Nama Posisi"],["lvl","Level Jabatan",["Staff","Manager","Director"]],["hp","No. HP"],["edu","Level Pendidikan",["D3","D4","S1","S2","S3"]],["jur","Jurusan"],["uni","Universitas"],["src","Sumber Lowongan",SRC],["tgl","Tanggal Lamaran Masuk","date"]];
const FL={t:"Tanggal",h:"Hasil",k:"Keterangan",w:"Waktu",p:"PIC",n:"Nama User",s:"Status"};
const SCH={psi:"thk",hc:"twpk",pc:"thk",ipg:"th",tms:"th",usr:"nth",mcu:"th",off:"th",join:"ts"};
const fixX=c=>{ST.forEach(([k])=>{const s=c[k]=c[k]||{};if(s.x!==undefined){if(k=="hc"){const[w,...p]=s.x.split(" ");s.w=w||"";s.p=p.join(" ")}if(k=="usr")s.n=s.x;delete s.x}SCH[k].split("").forEach(f=>{if(s[f]===undefined)s[f]=""})});return c};
const TABS=["Proses","Talent Pool","Reject","Join"],PC={Proses:"a","Talent Pool":"v",Reject:"r",Join:"g"},KEY="rt_cands_v5";
const uid=()=>Math.random().toString(36).slice(2,9);
const D=s=>{const[a,b]=s.split("/");return"2026-"+b.padStart(2,"0")+"-"+a.padStart(2,"0")};
const nd=s=>{s=(s||"").trim();if(/^\d{4}-\d\d-\d\d$/.test(s))return s;const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);return m?(m[3].length==2?"20"+m[3]:m[3])+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):""};
const fd=s=>s?s.split("-").reverse().join("/"):"-";
const ini=n=>(n||"?").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const P=s=>{const[a,h,k,x]=(s||"").split(",");return{t:a?D(a):"",h:h||"",k:k||"",x:x||""}};
const blank=()=>{const c={id:""};F.forEach(([k])=>c[k]="");ST.forEach(([k])=>{c[k]={};SCH[k].split("").forEach(f=>c[k][f]="")});return c};

const SEED=[];
const mk=l=>{const p=l.split("|"),c=blank();c.id=uid();["nama","per","pos","lvl","edu","jur","uni","src"].forEach((k,i)=>c[k]=p[i]);c.tgl=p[8]?D(p[8]):"";ST.forEach(([k],i)=>c[k]=P(p[9+i]));return fixX(c)};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v))return v.map(fixX)}catch(e){}return SEED.map(mk)}
let data=load(),col=-1,tab="",q="",src="",sort="new",view="grid";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3500)};
const info=c=>{let cur=-1,rej=-1,tp=0;ST.forEach(([k],i)=>{const s=c[k]||{};const v=Object.values(s).join(" ");if(v.trim())cur=i;if(rej<0&&/reject/i.test(v))rej=i;if(/talent/i.test(v))tp=1});

const p2=n=>String(n).padStart(2,"0"),N=s=>String(s==null?"":s).toLowerCase().replace(/\s+/g," ").trim();
const BIO=[["nama",/nama pelamar|^nama$/],["per",/perusahaan/],["pos",/posisi/],["lvl",/level jabatan/],["hp",/\bhp\b|telepon/],["edu",/pendidikan/],["jur",/jurusan/],["uni",/universitas/],["src",/sumber/],["tgl",/lamaran/]];
const GR=[["psi",/psikotes/],["ipg",/committe|ipg/],["hc",/interview hc/],["pc",/plus|consulting/],["tms",/tms/],["usr",/user/],["mcu",/mcu/],["off",/offering/],["join",/^join/]];
const SUB=[["n",/nama user/],["t",/tanggal/],["h",/hasil/],["k",/keterangan/],["w",/waktu/],["p",/pic/],["s",/status/]];
const sv=v=>String(v==null?"":v).trim();
const dv=v=>{let d;if(v instanceof Date)d=new Date(v.getTime()+432e5);else if(typeof v=="number"&&v>20000)d=new Date(Math.round((v-25569)*864e5)+432e5);else return nd(sv(v));return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const tv=v=>{if(v instanceof Date&&v.getFullYear()<1950){const d=new Date(v.getTime()+3e4);return p2(d.getHours())+"."+p2(d.getMinutes())}if(typeof v=="number"&&v<1){const m=Math.round(v*1440);return p2(Math.floor(m/60))+"."+p2(m%60)}return sv(v)};
const pv=v=>typeof v=="number"?(v<=1?Math.round(v*1000)/10:v)+"%":sv(v);
function parseSheet(rows){
  const r=rows.findIndex(x=>x.some(v=>/nama pelamar/.test(N(v))));if(r<0)return[];
  const has=i=>rows[i]&&rows[i].some(v=>/^(hasil|keterangan|waktu|pic)$/.test(N(v)));
  let g=r,s=r,st=r+1;if(has(r+1)){s=r+1;st=r+2}else if(has(r)&&r>0)g=r-1;
  const top=rows[g]||[],sub=rows[s]||[],W=Math.max(top.length,sub.length),fs=top.findIndex(v=>/psikotes/.test(N(v))),map=[];let grp=null;
  for(let j=0;j<W;j++){
    if(fs>=0&&j>=fs){const t=N(top[j]);if(t){const m=GR.find(x=>x[1].test(t));grp=m?m[0]:null}const m=SUB.find(x=>x[1].test(N(sub[j])));map[j]=grp&&m?[grp,m[0]]:null}
    else{const m=BIO.find(x=>x[1].test(N(top[j])||N(sub[j])));map[j]=m?[m[0]]:null}
  }
  const out=[];
  rows.slice(st).forEach(row=>{const c=blank();c.id=uid();
    map.forEach((m,j)=>{if(!m)return;const v=row[j];
      if(m.length==1)c[m[0]]=m[0]=="tgl"?dv(v):sv(v);
      else c[m[0]][m[1]]=m[1]=="t"?dv(v):m[1]=="w"?tv(v):m[0]=="psi"&&m[1]=="h"?pv(v):sv(v)});
    if(c.nama&&N(c.nama)!="nama pelamar")out.push(c)});
  return out}
const need=n=>window[n]?true:(toast("Library "+n+" gagal dimuat. Periksa koneksi internet."),false);
async function saveFile(name,blob){
  try{const d=window.claude&&await claude.use("downloads");if(d){await d.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}

  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Rekrutmen",{views:[{state:"frozen",xSplit:3,ySplit:2}]});

    else x.value=v;
    x.border=bd;x.font={size:10};x.alignment={vertical:"middle",horizontal:isD||res||key=="no"?"center":"left"};
    const m=String(v).toUpperCase(),fl=m=="REJECT"?"FFF8C9CF":m=="NEXT"?"FFCDE4F8":m=="TALENT POOL"?"FFCDEFD3":"";
    if(fl&&res)x.fill={type:"pattern",pattern:"solid",fgColor:{argb:fl}}}));
  cols.forEach(([key,lb],i)=>{ws.getColumn(i+1).width=key=="no"?6:Math.min(40,Math.max(12,lb.length+2,...data.map(d=>String(val(d,key)).length+2)))});
  ws.autoFilter={from:{row:2,column:1},to:{row:2,column:cols.length}};
  const s2=wb.addWorksheet("Ringkasan");s2.addRow(["Ringkasan rekrutmen","Jumlah"]).font={bold:true};s2.addRow(["Total kandidat",data.length]);
  TABS.forEach(t=>s2.addRow(["Status: "+t,data.filter(c=>info(c).st===t).length]));COLS.forEach((t,i)=>s2.addRow(["Tahap saat ini: "+t,data.filter(c=>info(c).i+1===i).length]));s2.getColumn(1).width=36;
  try{const buf=await wb.xlsx.writeBuffer();await saveFile("kandidat-rekrutmen-"+new Date().toISOString().slice(0,10)+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}catch(err){toast("Gagal membuat file Excel")}};
render();
